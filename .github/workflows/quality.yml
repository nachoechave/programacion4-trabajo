name: Rails quality
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      CI: "true"
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: digital_custody_test
      DB_USER: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.12"
          bundler-cache: true
      - run: bundle exec rails db:prepare
      - run: bundle exec rails test
      - run: gem install rubocop brakeman --no-document
      - run: rubocop --lint
      - run: brakeman --no-pager -q
