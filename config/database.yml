# PostgreSQL. Versions 9.5 and up are supported.
#
# Install the pg driver:
#   gem install pg
# On macOS with Homebrew:
#   gem install pg -- --with-pg-config=/opt/homebrew/bin/pg_config
# On Windows:
#   gem install pg
#       Choose the win32 build.
#       Install PostgreSQL and put its /bin directory on your path.
#
# Configure Using Gemfile
# gem "pg"
#
default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: digital_custody_development

test:
  <<: *default
  database: digital_custody_test

# En producción se usa una única variable DATABASE_URL.
# Ejemplo:
# postgresql://digital_custody:CLAVE@127.0.0.1/digital_custody_production
production:
  <<: *default
  url: <%= ENV.fetch("DATABASE_URL") %>
